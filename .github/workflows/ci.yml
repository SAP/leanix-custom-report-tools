name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-and-build:
    name: Lint & Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create report with CLI
        run: |
          node packages/create-custom-report/dist/index.cjs my-report \
            --title "My Custom Report" \
            --description "A custom report for LeanIX" \
            --skipAuth \
            --overwrite

      - name: Link vite plugin
        working-directory: packages/vite-plugin
        run: npm link

      - name: Link vite plugin in created report
        working-directory: my-report
        run: npm link @sap/vite-plugin-leanix-custom-report

      - name: Install created report dependencies
        working-directory: my-report
        run: npm install

      - name: Build created report
        working-directory: my-report
        run: npm run build
