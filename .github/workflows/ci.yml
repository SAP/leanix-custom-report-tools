name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-and-build:
    name: Lint & Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create report with CLI
        run: |
          node packages/create-custom-report/dist/index.cjs my-report \
            --title "My Custom Report" \
            --description "A custom report for LeanIX" \
            --skipAuth \
            --overwrite

      - name: Link vite plugin
        working-directory: packages/vite-plugin
        run: npm link

      - name: Link vite plugin in created report
        working-directory: my-report
        run: npm link @sap/vite-plugin-leanix-custom-report

      - name: Install created report dependencies
        working-directory: my-report
        run: npm install

      - name: Build created report
        working-directory: my-report
        run: npm run build
